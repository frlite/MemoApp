name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 打 tag 发布时才需要签名密钥
    - name: Decode release keystore
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$RUNNER_TEMP/keystore"
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

    - name: Build release APK
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Build debug APK
      if: startsWith(github.ref, 'refs/')
      run: ./gradlew assembleDebug

    - name: Upload debug APK
      if: startsWith(github.ref, 'refs/')
      uses: actions/upload-artifact@v4
      with:
        name: 备忘录-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Verify APK signature
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # temurin JDK 不含 apksigner，改用签名块检查
        python3 - <<'PY'
        import glob, zipfile, sys
        apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
        data = open(apk, 'rb').read()
        magic = b'APK Sig Block 42'
        if data.count(magic) != 2:
            sys.exit(f'ERROR: APK 未签名 (签名块出现 {data.count(magic)} 次，应为 2 次)')
        names = zipfile.ZipFile(apk).namelist()
        print('APK 签名有效')
        print('  v2/v3 签名块: 存在')
        print('  文件大小:', len(data), 'bytes')
        PY

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "备忘录 ${GITHUB_REF_NAME}" \
          --generate-notes \
          app/build/outputs/apk/release/*.apk
