name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # apksigner 在 Android SDK build-tools 中，temurin JDK 不自带
    - name: Setup Android build-tools
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        curl -sL https://dl.google.com/android/repository/build-tools_r34-linux.zip -o /tmp/bt.zip
        python3 -c "import zipfile; zipfile.ZipFile('/tmp/bt.zip').extractall('/tmp/bt')"
        chmod +x /tmp/bt/android-14/apksigner

    - name: Decode release keystore
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build release APK
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
          -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
          -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
          -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

    - name: Build debug APK
      if: startsWith(github.ref, 'refs/')
      run: ./gradlew assembleDebug

    - name: Upload debug APK
      if: startsWith(github.ref, 'refs/')
      uses: actions/upload-artifact@v4
      with:
        name: 备忘录-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk

    # 用官方工具验证签名，失败即中止，避免发布未签名包
    - name: Verify APK signature
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        /tmp/bt/android-14/apksigner verify --print-certs \
          app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "备忘录 ${GITHUB_REF_NAME}" \
          --generate-notes \
          app/build/outputs/apk/release/*.apk
